<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#f4f0e8" name="theme-color"/>
  <title>
   修学旅行の謎
  </title>
  <link href="css/common.css" rel="stylesheet"/>
  <script defer="" src="js/common.js">
  </script>
 </head>
 <body data-page="top">
  <main class="top-shell">
   <header class="top-header">
    <p class="eyebrow">
     SCHOOL TRIP MYSTERY
    </p>
    <h1>
     修学旅行の謎
    </h1>
    <p class="lead">
     旅の終わりに、何かが待っている。
    </p>
   </header>
   <section class="panel">
    <div class="section-heading">
     <h2>
      エピソード
     </h2>
     <p class="muted" id="progress-summary">
      進行状況を読み込み中&hellip;
     </p>
    </div>
    <ol class="episode-list" id="episode-list">
    </ol>
    <div class="top-actions">
     <button class="button button-primary" id="continue-button" type="button">
      つづきから
     </button>
     <button class="button button-quiet" id="restart-button" type="button">
      最初から
     </button>
    </div>
   </section>
   <footer class="top-footer">
    <span aria-label="クリア者一覧（準備中）">
     クリア者一覧（準備中）
    </span>
    <span>
     progress is saved on this device
    </span>
   </footer>
  </main>
 </body>
</html>
