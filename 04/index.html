<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#f4f0e8" name="theme-color"/>
  <title>
   &starf;4 秘密の扉を開けよう｜修学旅行の謎
  </title>
  <link href="../css/common.css" rel="stylesheet"/>
  <link href="../css/episode04.css" rel="stylesheet"/>
  <link href="../css/theme.css" rel="stylesheet"/>
  <script defer="" src="../js/common.js">
  </script>
  <script defer="" src="../js/episode04.js">
  </script>
 </head>
 <body data-episode="4">
  <main class="hotel-shell">
   <header class="hotel-header">
    <a class="back-link" href="../index.html">
     &larr; トップへ
    </a>
    <button class="episode-chip" id="episode-open" type="button">
     EPISODE &starf;4 ⓘ
    </button>
   </header>
   <section class="hotel-heading">
    <p class="hotel-kicker">
     DAY 2 / HOTEL ROOM
    </p>
    <h1 data-episode-title="">
     秘密の扉を開けよう
    </h1>
    <p>
     部屋の壁に、重厚な額縁の絵画が掛けられている。
    </p>
   </section>
   <section aria-label="ホテルの客室の壁" class="room-stage" id="room-stage">
    <div aria-hidden="true" class="wallpaper-pattern">
    </div>
    <div aria-hidden="true" class="wall-sconce wall-sconce-left">
    </div>
    <div aria-hidden="true" class="wall-sconce wall-sconce-right">
    </div>
    <div aria-hidden="true" class="wall-wainscot">
    </div>
    <!-- 壁に埋め込まれた隠し空間 -->
    <div aria-label="壁の隠し空間" class="secret-niche" id="secret-niche">
     <div class="niche-recess">
      <div class="niche-backwall">
       <span aria-label="壁に刻まれた文字" class="hidden-katakana" id="hidden-katakana">
        ン
       </span>
      </div>
      <div aria-hidden="true" class="niche-shelf">
      </div>
      <!-- 金色のシーサー置物 -->
      <button aria-label="金色のシーサーの置物" class="golden-shisa" id="golden-shisa" type="button">
       <svg aria-hidden="true" class="shisa-svg" role="img" viewbox="0 0 180 180">
        <defs>
         <lineargradient id="goldMain" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#fff3b8">
          </stop>
          <stop offset="28%" stop-color="#e8be52">
          </stop>
          <stop offset="65%" stop-color="#b98622">
          </stop>
          <stop offset="100%" stop-color="#7c520d">
          </stop>
         </lineargradient>
         <lineargradient id="goldHighlight" x1="15%" x2="85%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#fffbe0">
          </stop>
          <stop offset="50%" stop-color="#f2cd68">
          </stop>
          <stop offset="100%" stop-color="#9e6d16">
          </stop>
         </lineargradient>
         <lineargradient id="goldShadow" x1="0%" x2="0%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#8c5f14">
          </stop>
          <stop offset="100%" stop-color="#4e3206">
          </stop>
         </lineargradient>
        </defs>
        <!-- 台座 -->
        <rect fill="url(#goldShadow)" height="16" rx="5" stroke="#5b3b09" stroke-width="2" width="128" x="26" y="148">
        </rect>
        <rect fill="url(#goldMain)" height="9" rx="3" stroke="#6e480d" stroke-width="1.5" width="116" x="32" y="142">
        </rect>
        <!-- 尻尾・たてがみ背面 -->
        <path d="M126 138 C154 134, 162 104, 146 84 C138 74, 128 82, 134 94 C140 106, 132 118, 122 122 Z" fill="url(#goldMain)" stroke="#6e480d" stroke-width="2">
        </path>
        <!-- 胴体 -->
        <path d="M52 142 C48 116, 56 92, 74 84 L112 84 C128 92, 134 116, 128 142 Z" fill="url(#goldMain)" stroke="#6e480d" stroke-width="2">
        </path>
        <!-- 前足 -->
        <path d="M58 104 C50 116, 50 132, 54 142 L70 142 C68 128, 70 116, 74 106 Z" fill="url(#goldHighlight)" stroke="#6e480d" stroke-width="1.8">
        </path>
        <path d="M122 104 C130 116, 130 132, 126 142 L110 142 C112 128, 110 116, 106 106 Z" fill="url(#goldHighlight)" stroke="#6e480d" stroke-width="1.8">
        </path>
        <!-- 巻き毛のたてがみ -->
        <circle cx="52" cy="64" fill="url(#goldMain)" r="13" stroke="#6e480d" stroke-width="1.8">
        </circle>
        <circle cx="128" cy="64" fill="url(#goldMain)" r="13" stroke="#6e480d" stroke-width="1.8">
        </circle>
        <circle cx="60" cy="42" fill="url(#goldMain)" r="12" stroke="#6e480d" stroke-width="1.8">
        </circle>
        <circle cx="120" cy="42" fill="url(#goldMain)" r="12" stroke="#6e480d" stroke-width="1.8">
        </circle>
        <circle cx="90" cy="34" fill="url(#goldHighlight)" r="14" stroke="#6e480d" stroke-width="1.8">
        </circle>
        <!-- 頭部 -->
        <rect fill="url(#goldHighlight)" height="52" rx="22" stroke="#6e480d" stroke-width="2.2" width="68" x="56" y="42">
        </rect>
        <!-- 耳 -->
        <path d="M56 50 L42 34 L62 42 Z" fill="url(#goldMain)" stroke="#6e480d" stroke-width="1.8">
        </path>
        <path d="M124 50 L138 34 L118 42 Z" fill="url(#goldMain)" stroke="#6e480d" stroke-width="1.8">
        </path>
        <!-- 眉と目 -->
        <path d="M64 56 Q74 48 84 56" fill="none" stroke="#5b3b09" stroke-linecap="round" stroke-width="3">
        </path>
        <path d="M96 56 Q106 48 116 56" fill="none" stroke="#5b3b09" stroke-linecap="round" stroke-width="3">
        </path>
        <circle cx="74" cy="63" fill="#3c2404" r="5.5">
        </circle>
        <circle cx="106" cy="63" fill="#3c2404" r="5.5">
        </circle>
        <circle cx="72.5" cy="61.5" fill="#fffbe0" r="1.8">
        </circle>
        <circle cx="104.5" cy="61.5" fill="#fffbe0" r="1.8">
        </circle>
        <!-- 鼻と口（阿吽の阿） -->
        <ellipse cx="90" cy="70" fill="url(#goldShadow)" rx="8" ry="5.5">
        </ellipse>
        <path d="M68 79 Q90 95 112 79 Q106 94 90 94 Q74 94 68 79 Z" fill="#4e3206">
        </path>
        <polygon fill="#fffbe0" points="73,80 77,87 80,80">
        </polygon>
        <polygon fill="#fffbe0" points="107,80 103,87 100,80">
        </polygon>
        <!-- ハイライト光沢 -->
        <path d="M70 46 Q90 40 110 46" fill="none" opacity="0.75" stroke="#fffdf0" stroke-linecap="round" stroke-width="2.2">
        </path>
       </svg>
      </button>
     </div>
    </div>
    <!-- 壁に掛けられた絵画 -->
    <div class="painting-wrap" id="painting-wrap">
     <div aria-hidden="true" class="painting-wire">
     </div>
     <div class="painting-frame" id="painting-frame">
      <div class="painting-inner">
       <svg aria-label="南国の海と夕日の絵画" class="painting-art" role="img" viewbox="0 0 320 220">
        <defs>
         <lineargradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#3b5875">
          </stop>
          <stop offset="48%" stop-color="#c97d63">
          </stop>
          <stop offset="100%" stop-color="#f2c47c">
          </stop>
         </lineargradient>
         <lineargradient id="seaGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#2b6b7c">
          </stop>
          <stop offset="100%" stop-color="#183f4d">
          </stop>
         </lineargradient>
        </defs>
        <rect fill="url(#skyGrad)" height="135" width="320">
        </rect>
        <circle cx="160" cy="106" fill="#fff3cf" opacity="0.9" r="26">
        </circle>
        <path d="M0 118 Q55 96 112 114 T225 112 T320 116 L320 135 L0 135 Z" fill="#2d4854" opacity="0.65">
        </path>
        <rect fill="url(#seaGrad)" height="85" width="320" y="135">
        </rect>
        <ellipse cx="160" cy="144" fill="#ffe7ad" opacity="0.65" rx="44" ry="4">
        </ellipse>
        <ellipse cx="160" cy="156" fill="#ffe7ad" opacity="0.45" rx="28" ry="3">
        </ellipse>
        <path d="M24 220 C26 175, 42 145, 62 126 L70 130 C52 152, 42 180, 40 220 Z" fill="#1b2c33">
        </path>
        <path d="M64 128 Q35 112 14 126 Q38 124 62 132 Z" fill="#1b2c33">
        </path>
        <path d="M65 127 Q48 96 24 98 Q46 106 63 130 Z" fill="#1b2c33">
        </path>
        <path d="M66 127 Q76 94 102 100 Q80 107 68 130 Z" fill="#1b2c33">
        </path>
        <path d="M67 129 Q94 114 112 130 Q88 125 67 132 Z" fill="#1b2c33">
        </path>
       </svg>
      </div>
      <!-- 左右タップ領域 -->
      <button aria-label="絵画の左側を調べる" class="painting-tap-zone tap-left" id="tap-left" type="button">
      </button>
      <button aria-label="絵画の右側を調べる" class="painting-tap-zone tap-right" id="tap-right" type="button">
      </button>
     </div>
    </div>
   </section>
   <section class="hotel-status">
    <p class="status-step" id="status-step">
     ROOM WALL
    </p>
    <p aria-live="polite" id="status-message">
     壁に掛けられた絵画を調べてみよう。
    </p>
   </section>
  </main>
  <!-- 導入ダイアログ -->
  <div class="modal-backdrop" id="episode-modal">
   <section class="object-modal">
    <button aria-label="閉じる" class="modal-close" id="episode-close" type="button">
     &times;
    </button>
    <p class="panel-eyebrow">
     EPISODE &starf;4
    </p>
    <h2>
     秘密の扉を開けよう
    </h2>
    <p class="modal-description">
     この絵画の裏には何かが隠されているらしい。
    </p>
    <button class="button button-primary" id="episode-start" type="button">
     絵画を調べる
    </button>
   </section>
  </div>
  <!-- クリア演出 第1段階ダイアログ -->
  <div class="modal-backdrop" hidden="" id="shisa-modal">
   <section class="object-modal message-dialog">
    <p class="panel-eyebrow">
     DISCOVERY
    </p>
    <h2>
     金のシーサーが入っていた！
    </h2>
    <button class="button button-primary" id="shisa-close" type="button">
     閉じる
    </button>
   </section>
  </div>
  <!-- クリア演出 第2段階ダイアログ -->
  <div class="modal-backdrop" hidden="" id="clear-modal">
   <section class="object-modal message-dialog">
    <p class="panel-eyebrow">
     CLEAR
    </p>
    <h2>
     クリア！
    </h2>
    <p class="modal-description">
     次に進む
    </p>
    <button class="button button-primary" id="clear-next" type="button">
     次に進む
    </button>
   </section>
  </div>
 </body>
</html>
