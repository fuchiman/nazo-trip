<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームデータ初期化</title>
</head>
<body>
  <h1>ゲームデータ初期化</h1>

  <p>合言葉を入力してください。</p>

  <input type="text" id="password" placeholder="合言葉">
  <button onclick="resetGameData()">初期化する</button>

  <p id="message"></p>

  <script>
    // このゲーム専用のlocalStorageキー
    const GAME_STORAGE_KEYS = [
      "schoolTripMystery_progress_v1",
      "schoolTripMystery_firstClear_v1"
      // 今後追加したキーもここに追加する
    ];

    function resetGameData() {
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password !== "これがあいことばです") {
        message.textContent = "合言葉が違います。";
        return;
      }

      // ゲーム専用のデータだけ削除
      GAME_STORAGE_KEYS.forEach(key => {
        localStorage.removeItem(key);
      });

      message.textContent = "ゲームデータをすべて初期化しました。";
    }
  </script>
</body>
</html>
